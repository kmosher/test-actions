name: Publish Release
on:
  workflow_call:
    inputs:
      sleep: {type: number, default: 0}
      sign: {type: boolean, default: false}
    outputs:
      docker_tag:
        value: ${{ jobs.publish-images.outputs.dated_tag }}
permissions:
  contents: read
  id-token: write
jobs:
  publish-images:
    name: "Publish Docker Images"
    runs-on: ubuntu-latest
    outputs:
      dated_tag: ${{ steps.publish.outputs.dated_tag }}
    steps:
      - run: sleep ${{ inputs.sleep }}
      - id: publish
        run: echo "dated_tag=$(date +%Y%m%d)-${GITHUB_SHA::7}-stub" >> "$GITHUB_OUTPUT"
  sign-images:
    name: "Sign Docker Images"
    needs: [publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign a dummy blob
        if: inputs.sign
        run: |
          echo "dummy $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > blob.txt
          cosign sign-blob --yes --bundle bundle.json blob.txt
      - name: Keep the signature
        if: inputs.sign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sig
          path: |
            blob.txt
            bundle.json
  publish-sdk:
    name: "Publish SDK"
    needs: [publish-images]
    runs-on: ubuntu-latest
    steps:
      - run: echo sdk
